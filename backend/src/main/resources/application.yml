# All environment-specific values come from environment variables.
# On Elastic Beanstalk set them in: Configuration > Updates, monitoring, and logging > Environment properties.
# The defaults below are only meant for running on your own laptop.

server:
  port: ${PORT:5000}              # Elastic Beanstalk (Java SE) forwards traffic to port 5000
  error:
    include-message: never

spring:
  application:
    name: healthdekho
  datasource:                     # Amazon RDS PostgreSQL
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthdekho}
    username: ${DATABASE_USERNAME:healthdekho}
    password: ${DATABASE_PASSWORD:healthdekho}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # tables are created by Flyway, never by Hibernate
  flyway:
    # db/migration = tables + insurance products (always)
    # db/demo      = 3 sample customers so you can log in. In production set
    #                SPRING_FLYWAY_LOCATIONS=classpath:db/migration to skip it.
    locations: classpath:db/migration,classpath:db/demo
  ai:
    model:
      chat: bedrock-converse      # Spring AI -> Amazon Bedrock
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          options:
            model: ${BEDROCK_MODEL_ID:amazon.nova-lite-v1:0}
            temperature: 0.2

app:
  jwt-secret: ${JWT_SECRET}       # required, at least 32 characters
  token-hours: ${TOKEN_HOURS:12}
  ai-enabled: ${AI_ENABLED:true}  # false = skip Bedrock and use simple catalog ranking
