server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: healthdekho-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthdekho}
    username: ${DATABASE_USERNAME:healthdekho}
    password: ${DATABASE_PASSWORD:healthdekho}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
app:
  security:
    jwt-secret: ${JWT_SECRET:local-only-change-this-secret-to-a-long-random-value-32chars}
    token-hours: ${TOKEN_HOURS:12}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  ai:
    enabled: ${AI_ENABLED:true}
