services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthdekho
      POSTGRES_USER: healthdekho
      POSTGRES_PASSWORD: healthdekho
    ports:
      - "5432:5432"
    volumes:
      - healthdekho-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthdekho -d healthdekho"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/healthdekho
      DATABASE_USERNAME: healthdekho
      DATABASE_PASSWORD: healthdekho
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-production-secret-value}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  healthdekho-db:
